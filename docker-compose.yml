# docker-compose.yml — iZCloud (MySQL + Node)
# Recomendado para deploy em Oracle Cloud Free (VM sempre-on + IP estatico).
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${IDCLOUD_PASS:-senha_forte_aqui}
      MYSQL_DATABASE: ${CORE_DB:-izcloud_core}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema_core.sql:/docker-entrypoint-initdb.d/schema_core.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${IDCLOUD_PASS:-senha_forte_aqui}"]
      interval: 10s
      timeout: 5s
      retries: 5

  izcloud:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      IDCLOUD_HOST: mysql
      IDCLOUD_PORT: 3306
      IDCLOUD_USER: root
      IDCLOUD_PASS: ${IDCLOUD_PASS:-senha_forte_aqui}
      CORE_DB: ${CORE_DB:-izcloud_core}
      JWT_SECRET: ${JWT_SECRET:-trocavel_em_producao}
      IZCLOUD_ADMIN_KEY: ${IZCLOUD_ADMIN_KEY:-chave_setup}
      PORT: 3100
      # Canal iDCloud. IDCLOUD_HOST e o MySQL (acima); o bind do canal e este.
      IDCLOUD_BIND: 0.0.0.0
      IDCLOUD_PORTA: 443
      REP_ADMIN_SENHA: ${REP_ADMIN_SENHA:-admin}
      IDCLOUD_AFD_LIMIT: ${IDCLOUD_AFD_LIMIT:-0}
      IDCLOUD_AUTOACEITE: ${IDCLOUD_AUTOACEITE:-true}
      # URL publica usada para montar a URL de push do iDFace. Se vazio, usa
      # o host da requisicao (funciona atras de proxy com trust proxy).
      IZCLOUD_PUBLIC_URL: ${IZCLOUD_PUBLIC_URL:-}
    volumes:
      # AFD bruto (iDClass/iDFace) e importacoes. Sem volume, some no redeploy.
      - afd_data:/app/data/afd
    ports:
      - "3100:3100"
      - "443:443"

volumes:
  mysql_data:
  afd_data:
